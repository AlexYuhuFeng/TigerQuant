# SIMULATED deterministic scenario. Not trading advice and not market data.
# Monday 2026-03-02, 09:40 America/New_York (14:40Z), inside the approved order window.
scenario_id: trend_up
description: Single ETF trending up; the reference momentum rule enters once.
mode: BACKTEST
start: "2026-03-02T14:40:00Z"
interval: 1m
initial_cash: "100000.00"
universe: ["SPY"]
max_fact_age_seconds: 900

strategy:
  kind: momentum
  lookback: 3
  entry_threshold_bps: "10"
  exit_threshold_bps: "10"
  target_weight: "0.05"
  horizon: "5 trading days"

# Fixture-scoped limits. Illustrative only; the owner approves the real policy.
risk:
  gross_exposure_fraction: "0.50"
  max_symbol_fraction: "0.10"
  max_order_fraction: "0.10"
  max_mark_age_seconds: 900
  allow_margin: false
  allow_short: false
  allow_options: false
  max_orders_per_cycle: 1

broker:
  fill_policy: immediate
  commission_per_share: "0.005"
  slippage_bps: "1"

instruments:
