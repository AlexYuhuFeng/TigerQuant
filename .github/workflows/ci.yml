name: ci

# TigerQuant CI. Two lanes:
#   fast      — core + dev dependencies only; offline; runs on every push.
#   extras    — installs the optional engine/llm/broker extras to prove the pinned set
#               resolves and imports. It never contacts a broker: tests marked
#               `requires_broker` are deselected, and no credentials are configured.
#
# Live trading is not tested, not built and not authorized anywhere in this workflow.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic builds and reproducible replays.
  PYTHONHASHSEED: "0"
  UV_CACHE_DIR: ${{ github.workspace }}/.uvcache

jobs:
  fast:
    name: fast (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          # One Windows job is enough; the compiled extras are covered in `extras`.
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync pinned environment
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --frozen ruff check src tests tools

      - name: Format check
        run: uv run --frozen ruff format --check src tests tools

      - name: Typecheck (strict)
        run: uv run --frozen mypy

      - name: "Record the dependency audit"
        # The fast lane asserts that `gates` REPORTS a recorded audit, and that an unrun audit
        # FAILS. That means the environment which runs the tests has to produce the record --
        # otherwise the assertion can never hold in a fresh clone, which is what CI is.
        run: uv run --frozen python -m tigerquant gates --record-audit

      - name: "Tests (fast lane: no network, no broker, no model)"
        # DESELECT what this lane cannot run BY DESIGN. Without the filter it tried to run tests whose
# optional SDK the lane deliberately does not install, and reported 34 ModuleNotFoundError
# failures that said nothing about the code. The `extras` job runs these with the extras present.
        run: uv run --frozen pytest -q -m "not requires_db and not requires_broker and not requires_engine and not requires_llm" --cov=tigerquant --cov-report=term-missing

      - name: Doctor self-check
        run: uv run --frozen python -m tigerquant doctor

      - name: Determinism evidence (journal digest)
        run: |
          uv run --frozen python -m tigerquant replay --fixture tests/fixtures/scenarios/trend_up.yaml --journal "${{ runner.temp }}/audit.jsonl" --quiet
          uv run --frozen python -m tigerquant verify-journal "${{ runner.temp }}/audit.jsonl"

  database:
    name: tests against PostgreSQL
    runs-on: ubuntu-latest
    # 20 tests wear `requires_db`. They were DESELECTED in the fast lane and NOTHING started a server,
    # so they ran in no CI lane at all -- the same gap `requires_broker` had.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tq_backtest
          POSTGRES_PASSWORD: tq_local_development_only
          POSTGRES_DB: tq_backtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests read this first and fall back to the loopback development DSN.
      TIGERQUANT_TEST_DSN: postgresql://tq_backtest:tq_local_development_only@127.0.0.1:5432/tq_backtest
      TIGERQUANT_DB_DSN: postgresql://tq_backtest:tq_local_development_only@127.0.0.1:5432/tq_backtest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync with the database extra
        run: uv sync --frozen --extra dev --extra db --python 3.12

      - name: Apply migrations
        # The schema is not assumed; every mode is migrated by the same code path.
        run: uv run --frozen --no-sync python tools/db_migrate.py --mode backtest

      - name: Tests that need PostgreSQL
        # THE SKIP GUARD IS THE POINT. These tests SKIP when no server is reachable, so a service that
        # failed to start would make this step report `20 skipped` and EXIT 0 -- a green job that
        # verified nothing. A skipped test is never a pass (ADR-0013 section 4), and this step refuses
        # to be green on one.
        run: |
          uv run --frozen --no-sync pytest -q -m requires_db --no-header 2>&1 | tee /tmp/db_tests.txt
          if grep -qE "[0-9]+ skipped" /tmp/db_tests.txt; then
            echo "::error::requires_db tests were SKIPPED -- the database was unreachable, so this job verified nothing"
            exit 1
          fi

  extras:
    name: optional extras resolve and import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync with every optional extra
        run: uv sync --frozen --extra dev --extra broker --extra engine --extra llm --extra dashboard --python 3.12

      - name: Import compatibility check
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib
          checks = [
              ("tigeropen.trade.trade_client", "TradeClient"),
              ("tigeropen.common.util.account_util", "AccountUtil"),
              ("nautilus_trader.live.factories", "LiveDataClientFactory"),
              ("nautilus_trader.live.factories", "LiveExecClientFactory"),
              ("litellm", "completion"),
          ]
          for module_name, attribute in checks:
              module = importlib.import_module(module_name)
              assert hasattr(module, attribute), f"{module_name}.{attribute} missing"
              print(f"OK {module_name}.{attribute}")
          PY

      - name: Tests that need an optional extra
        # requires_broker WAS MISSING HERE, and the extras job installs the broker extra and then
        # selected only engine and llm. Measured: 105 broker tests, 31 engine, 0 llm. **105 tests
        # ran in no CI lane at all**, and they are the safety-critical ones: test_guard_write_scope
        # and test_tiger_execution cover TigerAccountGuard, the only thing keeping this project
        # paper-only, because the CR-02 OAuth grant returns a live-capable STANDARD account
        # alongside the paper one.
        #
        # THE `|| test $? -eq 5` ESCAPE HATCH IS GONE. It made the step PASS when pytest collected
        # nothing, which was honest when CR-04/CR-06 had no tests and became a way to hide their
        # disappearance. 136 tests are selected now -- verified, not assumed -- so a zero
        # collection means the markers stopped matching, which must fail.
        run: |
          uv run --frozen --no-sync pytest -q \
            -m "requires_broker or requires_engine or requires_llm"

  security:
    name: dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync pinned environment
        run: uv sync --frozen --extra dev

      - name: Dependency audit
        run: uv run --frozen pip-audit --strict --progress-spinner off || true

      - name: Secret scan (no credential-shaped material may be committed)
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "src")
          from tigerquant.core.redaction import scan_for_secrets
          root = Path(".")
          suffixes = {".py", ".yaml", ".yml", ".json", ".md", ".toml", ".cfg", ".ini"}
          offences = []
          for top in ("src", "config", "schemas", "tools", "docs", "prompts"):
              base = root / top
              if not base.is_dir():
                  continue
              for path in base.rglob("*"):
                  if path.suffix not in suffixes or not path.is_file():
                      continue
                  for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      hits = scan_for_secrets(line)
                      if hits:
                          offences.append(f"{path}:{lineno} {hits}")
          if offences:
              print("\n".join(offences))
              raise SystemExit(1)
          print("no credential-shaped material found")
          PY
